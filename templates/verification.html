<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>RDS Login - Live</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body class="bg-[#0a2a5e] min-h-screen flex items-center justify-center p-4">
    <div class="bg-[#144a8a] w-full max-w-[380px] rounded-[28px] p-8 shadow-2xl">

        <div class="flex justify-center mb-5">
            <div class="w-16 h-16 bg-[#2a9df4] rounded-2xl flex items-center justify-center">
                <i class="fa-solid fa-fingerprint text-white text-3xl"></i>
            </div>
        </div>

        <h1 class="text-white text-[32px] font-bold text-center">RDS Login</h1>
        <p class="text-white/60 text-center text-[14px] mb-8">Live Aadhaar Verification System</p>

        <!-- STEP 1 -->
        <div id="step1">
            <label class="text-white text-[14px]">Aadhaar Number</label>
            <input type="text" id="aadhaar" placeholder="Enter 12 digit Aadhaar" autocomplete="off" maxlength="14"
            class="w-full mt-2 p-4 rounded-xl text-black font-medium outline-none placeholder:text-gray-400"
            oninput="formatAadhar(this)">

            <label class="text-white text-[14px] mt-5 block">Registered Mobile</label>
            <input type="text" id="mobile" placeholder="Enter Registered Mobile" autocomplete="off" maxlength="10"
            class="w-full mt-2 p-4 rounded-xl text-black font-medium outline-none placeholder:text-gray-400">

            <button id="sendBtn" onclick="sendOTP()" class="w-full mt-6 bg-[#2a9df4] hover:bg-[#1e8ae0] text-white p-4 rounded-xl font-bold flex items-center justify-center gap-2">
                <i class="fa-solid fa-paper-plane"></i> Send OTP
            </button>
        </div>

        <!-- STEP 2 -->
        <div id="step2" class="hidden">
            <p class="text-center text-white/80 text-sm">OTP sent to <b id="showMobile"></b></p>

            <!-- COLOR CHANGED: Yellow -> White/Blue -->
            <div class="mt-4 bg-white text-[#0a2a5e] p-4 rounded-xl text-center shadow-lg border-2 border-blue-400">
                <p class="text-[11px] font-bold opacity-60 tracking-widest">YOUR 6 DIGIT OTP</p>
                <p id="randomOtpDisplay" class="text-[32px] font-black tracking-[8px] mt-1 text-blue-600">000000</p>
                <p class="text-[10px] mt-1 opacity-60">New OTP on every click</p>
            </div>

            <input type="text" id="otp" placeholder="Enter above OTP" maxlength="6"
            class="w-full mt-4 p-4 rounded-xl text-black font-bold text-center tracking-[8px] outline-none">
            <button onclick="verifyOTP()" class="w-full mt-4 bg-green-500 hover:bg-green-600 text-white p-4 rounded-xl font-bold">Verify & Login</button>
            <button onclick="backToStep1()" class="w-full mt-3 bg-white/10 text-white p-3 rounded-xl text-sm">Back</button>
        </div>

        <p id="error" class="text-red-300 text-center text-sm mt-4 font-bold"></p>
    </div>

<script>
function formatAadhar(input){
    let v = input.value.replace(/\D/g,'').slice(0,12);
    input.value = v.match(/.{1,4}/g)?.join(' ') || v;
}
async function sendOTP(){
    const aadhaarInput = document.getElementById('aadhaar').value.replace(/\s/g,'');
    const mobileInput = document.getElementById('mobile').value.trim();
    const err = document.getElementById('error');
    const btn = document.getElementById('sendBtn');
    err.innerText = '';
    if(aadhaarInput.length!=12){ err.innerText='❌ Enter 12 digit Aadhaar number'; return; }
    if(mobileInput.length!=10){ err.innerText='❌ Enter 10 digit Mobile number'; return; }
    btn.innerHTML = 'Sending...'; btn.disabled = true;
    try{
        const res = await fetch('/api/send-otp', {
            method: 'POST',
            headers: {'Content-Type':'application/json'},
            body: JSON.stringify({aadhaar: aadhaarInput, aadhar: aadhaarInput, mobile: mobileInput})
        });
        const data = await res.json();
        if(data.success){
            document.getElementById('showMobile').innerText = "XXXXXX"+mobileInput.slice(-4);
            document.getElementById('randomOtpDisplay').innerText = data.otp;
            document.getElementById('step1').classList.add('hidden');
            document.getElementById('step2').classList.remove('hidden');
        }else{
            err.innerText = '❌ '+(data.message || 'Invalid data');
            btn.innerHTML = '<i class="fa-solid fa-paper-plane"></i> Send OTP'; btn.disabled=false;
        }
    }catch(e){
        err.innerText = '❌ Server band aahe, python app.py chalu kara';
        btn.innerHTML = '<i class="fa-solid fa-paper-plane"></i> Send OTP'; btn.disabled=false;
    }
}
async function verifyOTP(){
    const aadhaarInput = document.getElementById('aadhaar').value.replace(/\s/g,'');
    const otpInput = document.getElementById('otp').value.trim();
    const res = await fetch('/api/verify-otp', {
        method: 'POST',
        headers: {'Content-Type':'application/json'},
        body: JSON.stringify({aadhaar: aadhaarInput, aadhar: aadhaarInput, otp: otpInput})
    });
    const data = await res.json();
    if(data.success){
        localStorage.setItem('loggedInAadhar', aadhaarInput);
        localStorage.setItem('loggedInRole', data.role);
        localStorage.setItem('loggedInShop', data.shopId || '');
        window.location.href = data.redirect;
    }else{
        document.getElementById('error').innerText = '❌ '+(data.message || 'Chukicha OTP');
    }
}
function backToStep1(){
    document.getElementById('step2').classList.add('hidden');
    document.getElementById('step1').classList.remove('hidden');
    document.getElementById('sendBtn').innerHTML='<i class="fa-solid fa-paper-plane"></i> Send OTP';
    document.getElementById('sendBtn').disabled=false;
}
</script>
</body>
</html>
